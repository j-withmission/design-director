<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#FAF8F2;font-family:Rockwell,"Courier New",serif;color:#121314;position:relative}
.frame{position:absolute;inset:20px;border:3px solid #121314}
.chart{position:absolute;left:0;right:0;top:44px;bottom:70px;display:flex;flex-direction:column;justify-content:center}
.row{display:grid;grid-template-columns:1fr 500px 1fr;align-items:last baseline}
.l,.n{font:600 14px "Avenir Next Condensed","Avenir Next",sans-serif;color:#6C685F;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.l{justify-self:end}
.n{justify-self:start}
.t{justify-self:center;font-weight:700;white-space:nowrap}
.o .t{letter-spacing:.62em;margin-right:-.62em}
.r1 .t{font-size:140px;line-height:136px}
.r2 .t{font-size:86px;line-height:92px}
.r3 .t{font-size:62px;line-height:72px}
.r4 .t{font-size:45px;line-height:60px}
.r5 .t{font-size:34px;line-height:50px}
.r6 .t{font-size:15px;line-height:30px;letter-spacing:.14em;margin-right:-.14em}
.r7 .t{font-size:10px;line-height:22px;letter-spacing:.14em;margin-right:-.14em}
.rule{width:620px;height:2px;margin:4px auto 6px}
.red{background:#B3312A}.green{background:#2D7A4B}
.foot{position:absolute;left:52px;right:52px;bottom:40px;display:flex;justify-content:space-between;font:500 15px "Avenir Next",sans-serif;color:#4F4C46}
</style></head><body><div class="frame"></div>
<div class="chart">
<div class="row o r1"><span class="l">20/200</span><span class="t">D</span><span class="n">1</span></div>
<div class="row o r2"><span class="l">20/100</span><span class="t">ES</span><span class="n">2</span></div>
<div class="row o r3"><span class="l">20/70</span><span class="t">IGN</span><span class="n">3</span></div>
<div class="row o r4"><span class="l">20/50</span><span class="t">DIRE</span><span class="n">4</span></div>
<div class="row o r5"><span class="l">20/40</span><span class="t">CTOR</span><span class="n">5</span></div>
<div class="rule red"></div>
<div class="row r6"><span class="l">20/30</span><span class="t">THE CRITIC SEES PIXELS, NEVER CODE</span><span class="n">6</span></div>
<div class="row r7"><span class="l">20/20</span><span class="t">PAIRWISE CHECK: 20/20 ON KNOWN REGRESSIONS</span><span class="n">7</span></div>
<div class="rule green"></div>
</div>
<div class="foot"><span>A design process for Claude Code</span><span>github.com/j-withmission/design-director</span></div>
</body></html>
