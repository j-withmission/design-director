<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#2E2D2A;font-family:Rockwell,"Courier New",serif;color:#141516}
.box{position:absolute;inset:22px 24px;border:4px solid #9A9DA0;background:radial-gradient(ellipse 70% 80% at 50% 45%,#FFFEFA 0%,#FBF9F3 55%,#ECE8DE 100%);box-shadow:inset 0 0 0 1px #D9D5CB}
.chart{position:absolute;left:0;right:0;top:30px;bottom:46px;display:flex;flex-direction:column;justify-content:center}
.row{display:grid;grid-template-columns:1fr 540px 1fr;align-items:last baseline}
.l,.n{font-size:14px;font-weight:700;color:#77736A;letter-spacing:.06em}
.l{justify-self:end;padding-right:34px}
.n{justify-self:start;padding-left:34px}
.t{justify-self:center;font-weight:700;letter-spacing:.3em;margin-right:-.3em;white-space:nowrap}
.r1 .t{font-size:150px;line-height:128px}
.r2 .t{font-size:75px;line-height:92px}
.r3 .t{font-size:52.5px;line-height:68px}
.r4 .t{font-size:37.5px;line-height:52px}
.r5 .t{font-size:30px;line-height:44px}
.r6 .t{font-size:22.5px;line-height:36px}
.r7 .t{font-size:15px;line-height:28px}
.rule{width:500px;height:2px;margin:3px auto 5px}
.red{background:#B3312A}.green{background:#2D7A4B}
.plate{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.26em;color:#8C877C}
</style></head><body><div class="box">
<div class="chart">
<div class="row r1"><span class="l">20/200</span><span class="t">D</span><span class="n">1</span></div>
<div class="row r2"><span class="l">20/100</span><span class="t">DESIGN</span><span class="n">2</span></div>
<div class="row r3"><span class="l">20/70</span><span class="t">DIRECTOR</span><span class="n">3</span></div>
<div class="row r4"><span class="l">20/50</span><span class="t">ITS CRITICS</span><span class="n">4</span></div>
<div class="row r5"><span class="l">20/40</span><span class="t">SEE ONLY PIXELS</span><span class="n">5</span></div>
<div class="rule red"></div>
<div class="row r6"><span class="l">20/30</span><span class="t">AND NEVER THE CODE</span><span class="n">6</span></div>
<div class="row r7"><span class="l">20/20</span><span class="t">20 OF 20 REGRESSIONS CAUGHT</span><span class="n">7</span></div>
<div class="rule green"></div>
</div>
<div class="plate">A DESIGN PROCESS FOR CLAUDE CODE &nbsp;·&nbsp; GITHUB.COM/J-WITHMISSION/DESIGN-DIRECTOR</div>
</div></body></html>
