<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#FAF8F2;color:#121314;position:relative;font-family:"Avenir Next Condensed","Avenir Next",sans-serif}
.chart{position:absolute;left:56px;width:640px;top:52px;bottom:30px;display:flex;flex-direction:column;justify-content:center}
.row{display:grid;grid-template-columns:64px 1fr 28px;column-gap:20px;align-items:last baseline}
.l,.n{font-weight:600;font-size:15px;color:#6C685F;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.l{justify-self:end}.n{justify-self:start}
.t{justify-self:center;font-family:Rockwell,"Courier New",serif;font-weight:700;white-space:nowrap;letter-spacing:.75em;margin-right:-.75em}
.r1 .t{font-size:132px;line-height:130px}
.r2 .t{font-size:99px;line-height:104px}
.r3 .t{font-size:74px;line-height:82px}
.r4 .t{font-size:56px;line-height:66px}
.r5 .t{font-size:42px;line-height:54px}
.r6 .t{font-size:24px;line-height:38px;letter-spacing:.14em;margin-right:-.14em}
.r7 .t{font-size:16px;line-height:30px;letter-spacing:.22em;margin-right:-.22em}
.rule{height:2px;margin:6px 48px 10px 84px}
.red{background:#B3312A}.green{background:#2D7A4B}
.label{position:absolute;left:776px;right:48px;top:296px}
.name{font-weight:700;font-size:62px;line-height:1;letter-spacing:0;white-space:nowrap}
.what{margin-top:28px;font-weight:500;font-size:30px;line-height:36px;color:#2A2B2D}
.url{margin-top:37px;line-height:1;font-weight:600;font-size:17px;letter-spacing:.04em;color:#6C685F}
</style></head><body>
<div class="chart">
<div class="row r1"><span class="l">20/200</span><span class="t">D</span><span class="n">1</span></div>
<div class="row r2"><span class="l">20/100</span><span class="t">ES</span><span class="n">2</span></div>
<div class="row r3"><span class="l">20/70</span><span class="t">IGN</span><span class="n">3</span></div>
<div class="row r4"><span class="l">20/50</span><span class="t">DIR</span><span class="n">4</span></div>
<div class="row r5"><span class="l">20/40</span><span class="t">ECTOR</span><span class="n">5</span></div>
<div class="rule red"></div>
<div class="row r6"><span class="l">20/30</span><span class="t">JUDGES PIXELS NOT CODE</span><span class="n">6</span></div>
<div class="row r7"><span class="l">20/20</span><span class="t">CAUGHT 20 OF 20 REGRESSIONS</span><span class="n">7</span></div>
<div class="rule green"></div>
</div>
<div class="label">
<div class="name">design-director</div>
<div class="what">A design process for Claude Code</div>
<div class="url">github.com/j-withmission/design-director</div>
</div>
</body></html>
