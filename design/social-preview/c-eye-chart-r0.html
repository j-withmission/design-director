<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#E6F1EA;color:#16181A;font-family:Rockwell,"Courier New",serif}
.chart{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.row{display:grid;grid-template-columns:200px 1fr 200px;align-items:last baseline}
.row .l{justify-self:start;padding-left:64px;font:600 13px Menlo,monospace;color:#5E6A63;letter-spacing:.04em}
.row .r{justify-self:end;padding-right:64px;font:600 13px Menlo,monospace;color:#5E6A63}
.row .t{justify-self:center;font-weight:700;text-transform:uppercase;white-space:nowrap}
.r1{height:146px}.r1 .t{font-size:118px;letter-spacing:.14em;line-height:146px}
.r2{height:98px}.r2 .t{font-size:74px;letter-spacing:.2em;line-height:98px}
.r3{height:66px}.r3 .t{font-size:46px;letter-spacing:.24em;line-height:66px}
.r4{height:50px}.r4 .t{font-size:32px;letter-spacing:.26em;line-height:50px}
.r5{height:40px}.r5 .t{font-size:23px;letter-spacing:.3em;line-height:40px}
.r6{height:34px}.r6 .t{font-size:17px;letter-spacing:.32em;line-height:34px}
.r7{height:30px}.r7 .t{font-size:13px;letter-spacing:.3em;line-height:30px}
.line{height:0;margin:6px 360px}
.redline{border-top:2px solid #B8322A}
.greenline{border-top:2px solid #2E7D4F}
</style></head><body><div class="chart">
<div class="row r1"><span class="l">20/200</span><span class="t">DESIGN</span><span class="r">1</span></div>
<div class="row r2"><span class="l">20/100</span><span class="t">DIRECTOR</span><span class="r">2</span></div>
<div class="row r3"><span class="l">20/70</span><span class="t">THE CRITIC</span><span class="r">3</span></div>
<div class="row r4"><span class="l">20/50</span><span class="t">ONLY SEES THE</span><span class="r">4</span></div>
<div class="row r5"><span class="l">20/40</span><span class="t">SCREENSHOT, NEVER THE CODE</span><span class="r">5</span></div>
<div class="line redline"></div>
<div class="row r6"><span class="l">20/30</span><span class="t">A DESIGN PROCESS FOR CLAUDE CODE</span><span class="r">6</span></div>
<div class="row r7"><span class="l">20/20</span><span class="t">PAIRWISE CRITIC: 20 OF 20 KNOWN REGRESSIONS CAUGHT</span><span class="r">7</span></div>
<div class="line greenline"></div>
</div></body></html>
