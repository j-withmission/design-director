<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Seal Salt</title>
<style>
  :root{--ground:#F0EBE3;--ink:#F4F0E8;--deep:#1B1640}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:1200px;overflow:hidden;background:var(--deep);font-family:"Inter",system-ui,sans-serif;color:var(--ink)}
  .sea{position:absolute;inset:0;
    background:
      repeating-linear-gradient(176deg,rgba(255,214,120,0) 0 26px,rgba(255,214,120,.22) 26px 28px,rgba(255,214,120,0) 28px 47px),
      repeating-linear-gradient(183deg,rgba(64,208,190,0) 0 31px,rgba(64,208,190,.18) 31px 33px,rgba(64,208,190,0) 33px 58px),
      linear-gradient(180deg,#8E86C9 0%,#5B4FA8 28%,#2C2470 55%,#1B1640 100%)}
  .sun{position:absolute;left:640px;top:200px;width:1000px;height:1200px;transform:translateX(-50%);
    background:radial-gradient(ellipse 14% 40% at 50% 40%,rgba(120,240,210,.55),rgba(120,240,210,0) 70%);mix-blend-mode:screen}
  .grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
  .top{position:absolute;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  .statement{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:1020px;text-align:center;
    font-family:"Bitstream Charter","Caladea","Liberation Serif",serif;font-size:38px;line-height:1.22;font-weight:400}
  .loc{position:absolute;top:268px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  .word{position:absolute;left:0;right:0;bottom:-.17em;text-align:center;font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:330px;line-height:1;letter-spacing:-.04em;white-space:nowrap;color:var(--ground)}
</style></head><body>
<div class="sea"></div><div class="sun"></div>
<svg class="grain" width="1280" height="1200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="8"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="top"><span>Salts</span><span>Seal &amp; Salt</span><span>Stockists</span></div>
<p class="statement">Seal &amp; Salt rakes flake salt by hand from three tidal pans, eight days after each spring tide, and nowhere else.</p>
<div class="loc">Salt works · Isle of Seil</div>
<div class="word">SEAL&amp;SALT</div>
<script>document.fonts.ready.then(()=>{const w=document.querySelector(".word");const s=getComputedStyle(w);const sx=(s.transform.match(/matrix\(([^,]+)/)||[0,1])[1]*1;w.style.display="inline-block";w.style.left="50%";w.style.right="auto";const need=1248/(w.scrollWidth*sx);w.style.fontSize=(parseFloat(s.fontSize)*need)+"px";w.style.transform=(sx!==1?"translateX(-50%) scaleX("+sx+")":"translateX(-50%)");});</script>
</body></html>
