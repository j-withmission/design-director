<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low contrast</title>
<!-- Known answer: contrast (#999 body text on #fff, about 2.8:1). Nothing else. -->
<style>
  body { margin: 0; background: #ffffff; color: #999999; font: 16px/1.6 Arial, Helvetica, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 { font-size: 36px; color: #111111; margin: 0 0 24px; }
  p { margin: 0 0 12px; }
  p.last { margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Account settings</h1>
  <p>Your plan renews on the first of every month.</p>
  <p>Invoices are sent to the billing address on file.</p>
  <p class="last">Contact support to change the account owner.</p>
</main>
</body>
</html>
